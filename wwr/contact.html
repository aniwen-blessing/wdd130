<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapids! Rafting - Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="header-content">
            <img src="images/logo.png" alt="Rapids! Rafting Logo">
            <nav>
                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="trips.html">Trips</a>
                <a href="contact.html">Contact Us</a>
            </nav>
        </div>
    </header>

    <main class="contact-page">
        <div class="container">
            <section class="contact-info">
                <h1>White Water Rafting</h1>
                <address>
                    Rapids! Rafting Basecamp<br>
                    123 River Trail<br>
                    Boulder, CO 80302
                    <a href="tel:+19999999999">+1 999 999 9999</a><br>
                    <a href="mailto:info@whitewater.com">info@whitewater.com</a>
                </address>
            </section>

            <div class="contact-layout">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2611.6298531453567!2d-113.15626142507142!3d37.42263243236839!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80ca91afad231a8f%3A0xec6734a36c88eb1f!2sKolob%20Canyons!5e1!3m2!1sen!2sng!4v1771074388086!5m2!1sen!2sng"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade" class="gmap"></iframe>

                <form action="#" class="contact-form">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required placeholder="Your full name">

                    <label for="email">Email:</label>
                    <input type="text" id="email" name="email" required
                      placeholder="Your email address">

                    <div class="purpose">
                        <p>Message Purpose:</p>
                        <fieldset>
                            <input id="inquiry" type="radio" name="purpose" value="inquiry"
                              required>
                            <label for="inquiry">General Inquiry</label>
                            <input id="reservation" type="radio" name="purpose" value="reservation">
                            <label for="reservation">Reservation Question</label>
                            <input id="feedback" type="radio" name="purpose" value="feedback">
                            <label for="feedback">Website Suggestions</label>
                        </fieldset>
                    </div>
                    <div class="full-w">
                        <label for="message">Message:</label>
                        <textarea id="message" name="message" rows="4" required
                          placeholder="Your message"></textarea>
                    </div>
                    <div class="subscribe">
                        <input type="checkbox" id="subscribe" name="subscribe" value="yes">
                        <label for="subscribe">Please Subscribe me to the monthly newsletter</label>
                    </div>
                    <button type="submit" class="btn btn-submit">Get in Touch!</button>
                </form>
            </div>

            <section class="employees">
                <h2>We Are Here to Serve You</h2>
                <div class="employees-grid">
                    <figure class="employee">
                        <img src="images/guide1.jpg" alt="John Mckenzie">
                        <figcaption>John Mckenzie</figcaption>
                    </figure>
                    <figure class="employee">
                        <img src="images/guide2.jpg" alt="Sarah Johnson">
                        <figcaption>Sarah Johnson</figcaption>
                    </figure>
                    <figure class="employee">
                        <img src="images/guide3.jpg" alt="Michael Chen">
                        <figcaption>Michael Chen</figcaption>
                    </figure>
                </div>
            </section>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 | Rapids! Rafting | Aniwen Blessing</p>
            <nav class="socialmedia">
                <a href="https://facebook.com" target="_blank" rel="noopener">
                    <img src="images/facebook-icon.png" alt="Follow us on Facebook">
                </a>
                <a href="https://twitter.com" target="_blank" rel="noopener">
                    <img src="images/twitter-icon.png" alt="Follow us on X (Twitter)">
                </a>
                <a href="https://instagram.com" target="_blank" rel="noopener">
                    <img src="images/instagram-icon.png" alt="Follow us on Instagram">
                </a>
            </nav>
        </div>
    </footer>
</body>

</html>
